# Primary experiment from docs/DrcPlaneFreeResearchPlan.md.
#
# Clean comparison with P1: same 12x12/3-robot bank and structured
# wall/goal/robot/time observation, but a faithful recurrent DRC(3,3).
# No stop-cell or distance helper planes. LR progress is anchored to a 200M
# horizon while total_steps is the current stop/review target, so the
# pre-registered extensions neither restart nor exhaust the schedule.
#
# 2026-07-25 -- RESTARTED FROM STEP 0 as `_v2`. The first attempt
# (run_name drc33_p1_12x12_planefree, W&B pupnnpq8) is abandoned, not resumed:
# its rewards were corrupted from step 0 by the truncation bootstrap
# (docs/Drc87MRestartCollapseInvestigation.md 6.1), which added gamma*V(expiry)
# to the reward on every truncated episode. V(expiry) is 0 by definition here --
# time_channel puts the horizon in the observation -- but it was measured at
# -1.87 by 5M steps and -12.3 by 87M against a goal_reward of 1.0, so EVERY
# checkpoint of that run, including the 80M one, was shaped by inflated rewards.
# There is no clean point to resume from, and this is also the first genuinely
# like-for-like comparison with P1, whose SB3 path never bootstrapped.
bank_path: artifacts/groundup_bank_12x12/size-12x12_numR3_ET2_CL2.parquet
out_dir: artifacts/groundup
run_name: drc33_p1_12x12_planefree_v2
curriculum: reverse
horizon: 24
shaping_coef: 0.1
time_channel: true
canonical_identity: true
stop_planes: false
distance_plane: false
seed: 11

# Frozen after the 2026-07-23 real-factory MPS benchmark. 256 envs was
# ~10.7% faster than 128 (1,742 vs 1,573 st/s); 512 gained only another 0.8%
# while increasing RSS from 2.1 to 3.3 GB. Recurrent minibatches contain whole
# n_steps-long environment sequences.
num_envs: 256
n_steps: 32
batch_size: 2048
n_epochs: 1

total_steps: 120000000
schedule_total_steps: 200000000
learning_rate: 3.0e-4
learning_rate_final: 5.0e-5
ent_coef: 0.01
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.05
adv_std_floor: 0.05
adv_clip: 10.0
clip_range_vf: null
# Horizon expiry is a genuine terminal here: time_channel puts the remaining-step
# fraction in the observation, so the MDP is finite-horizon and fully observed and
# V(s, remaining=0) == 0 by definition. Set explicitly rather than left to
# auto-detection so the config-contract fingerprint pins the reward semantics.
bootstrap_on_truncation: false

drc_depth: 3
drc_ticks: 3
drc_hidden_channels: 32
drc_cell_kernel: 3
drc_encoder_channels: [32, 32]
drc_encoder_kernels: [4, 4]
drc_encoder_strides: [1, 1]
drc_encoder_relu: false
drc_mlp_hidden: 256

eval_every: 1000000
eval_per_length: 25
final_eval_per_length: 60
final_eval_episodes: 3
eval_batch_size: 64
checkpoint_every: 5000000
# PAUSED 2026-07-25 18:42 BST at t=96,002,048 to conserve battery (9% left).
# Resume is bit-exact: this is a true iteration boundary, verified coherent, and
# the restart machinery was proven inert in
# docs/Drc87MRestartCollapseInvestigation.md 4. Set back to null only to start a
# genuinely new run.
resume_from: artifacts/groundup/drc33_p1_12x12_planefree_v2/training_pause_96002048.pt
device: auto
wandb_project: ricochet-robots-rl
wandb_run_name: groundup-drc33-p1-12x12-planefree-v2
