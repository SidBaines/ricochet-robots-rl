# Primary experiment from docs/DrcPlaneFreeResearchPlan.md.
#
# Clean comparison with P1: same 12x12/3-robot bank and structured
# wall/goal/robot/time observation, but a faithful recurrent DRC(3,3).
# No stop-cell or distance helper planes. The mandatory 60M review extended
# the same run to 120M under the pre-registered rules. LR progress remains
# anchored to the original 200M horizon, so exact resume neither restarts nor
# exhausts the schedule.
bank_path: artifacts/groundup_bank_12x12/size-12x12_numR3_ET2_CL2.parquet
out_dir: artifacts/groundup
run_name: drc33_p1_12x12_planefree
curriculum: reverse
horizon: 24
shaping_coef: 0.1
time_channel: true
canonical_identity: true
stop_planes: false
distance_plane: false
seed: 11

# Frozen after the 2026-07-23 real-factory MPS benchmark. 256 envs was
# ~10.7% faster than 128 (1,742 vs 1,573 st/s); 512 gained only another 0.8%
# while increasing RSS from 2.1 to 3.3 GB. Recurrent minibatches contain whole
# n_steps-long environment sequences.
num_envs: 256
n_steps: 32
batch_size: 2048
n_epochs: 1

total_steps: 120000000
schedule_total_steps: 200000000
learning_rate: 3.0e-4
learning_rate_final: 5.0e-5
ent_coef: 0.01
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
vf_coef: 0.5
max_grad_norm: 0.5
target_kl: 0.05
adv_std_floor: 0.05
adv_clip: 10.0
clip_range_vf: null

drc_depth: 3
drc_ticks: 3
drc_hidden_channels: 32
drc_cell_kernel: 3
drc_encoder_channels: [32, 32]
drc_encoder_kernels: [4, 4]
drc_encoder_strides: [1, 1]
drc_encoder_relu: false
drc_mlp_hidden: 256

eval_every: 1000000
eval_per_length: 25
final_eval_per_length: 60
final_eval_episodes: 3
eval_batch_size: 64
checkpoint_every: 5000000
# Immutable exact-state checkpoint selected for the registered 60M -> 120M
# continuation. This includes optimizer, schedule progress, curriculum,
# environments, recurrent rollout state, and every relevant RNG.
resume_from: artifacts/groundup/drc33_p1_12x12_planefree/training_60006400.pt
device: auto
wandb_project: ricochet-robots-rl
wandb_run_name: groundup-drc33-p1-12x12-planefree
