# PRIMARY LINE, continued to the pre-registered 200M horizon.
#
# History: v2 ran 0 -> 120M (docs/DrcPlaneFree120MReview.md). This run began as
# arm A0, the no-aux CONTROL for the auxiliary landing-cell experiment
# (docs/DrcAuxLandingLossResult.md), and continued 120M -> 135M unchanged. Since
# the aux arms were not adopted, A0 IS the primary line and simply continues:
# same run directory, one continuous curve.jsonl and probe series from 120M on.
#
# NOTE on the fingerprint: it reads d0932a4407a20f0b... here, not the v2-era
# e7b3bf2186299ec0..., because adding aux_landing_coef to DRCTrainConfig widened
# the contract's field set. The lineage is nonetheless a pure continuation --
# _contract_differences reports NO differing fields, since the new field sits at
# its default. This is the known cost of additive contract evolution: the check
# is exact, but the fingerprint STRING is only comparable within one code
# version. Compare fingerprints across commits only via _contract_differences.
#
# 2026-07-27: extended 135M -> 200M. Justification (review section 3, result
# section 9): the run has not converged. A0 gained +2.7pp over its last 15M
# (0.7708 -> 0.7979 on the 480-puzzle suite; best periodic 0.81 -> 0.84) and
# schedule_total_steps has always been 200M, so the LR anneal now completes
# exactly at the stop rather than being truncated at 68%.
#
# The run_name is kept as drc33_p1_aux_A0_control despite now being the primary
# line: renaming would fork curve.jsonl and the retained snapshot series.
