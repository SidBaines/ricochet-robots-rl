# Phase 4: bigger model, larger curriculum, longer puzzles.
# 16x16, 4 robots, deep BFS labels (lengths 1-8, up to 3 robots moved),
# ~10x fixture, residual grid CNN, 4-stage length curriculum with a
# stall safety-valve, 10M-step budget.
height: 16
width: 16
num_robots: 4
edge_t_per_quadrant: 2
central_l_per_quadrant: 2
fixture_attempts: 60000
solver_max_depth: 8
solver_max_nodes: 600000
min_optimal_length: 1
max_optimal_length: 8
min_robots_moved: 1
max_robots_moved: 3
heldout_fraction: 0.25
split_seed: 20260710
validation_test_seed: 20260711
suite_per_stratum: 6
max_steps: 20
cell_obs_pixel_size: 40
obs_mode: image
policy: grid_resnet
features_dim: 512
conv_channels: 128
n_conv_layers: 6
two_robot_band_weight: 1.0
run_overfit_milestone: false
curriculum_stage_max_lengths: [2, 4, 6, 8]
curriculum_success_threshold: 0.65
curriculum_min_episodes: 5000
curriculum_window: 500
curriculum_check_frequency: 100
curriculum_max_episodes_per_stage: 250000
training_seeds: [11]
checkpoints: [0, 1024000, 2048000, 4096000, 7168000, 10240000]
n_envs: 16
n_steps: 128
batch_size: 512
n_epochs: 4
learning_rate: 0.0003
gamma: 0.99
gae_lambda: 0.95
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5
validation_episodes_per_puzzle: 1
final_stochastic_episodes_per_puzzle: 5
baseline_episodes_per_puzzle: 20
overfit_puzzles_per_stratum: 4
overfit_stochastic_episodes_per_puzzle: 20
device: auto
wandb_project: ricochet-robots-rl
wandb_run_name: phase4-16x16-big
