[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ricochet-robots-rl"
version = "0.1.0"
description = "A reinforcement-learning environment for Ricochet Robots"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "gymnasium>=1.3,<1.4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3.1",
  "pyarrow>=18,<26",
  "PyYAML>=6,<7",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
training = [
  "psutil>=6,<8",
  "sb3-contrib>=2.7,<3",
  "stable-baselines3>=2.7,<3",
  "tensorboard>=2.18,<3",
  "torch>=2.8,<3",
]
monitoring = ["wandb>=0.19,<1"]
media = [
  "imageio>=2.37,<3",
  "kaleido>=1,<2",
  "matplotlib>=3.9,<4",
  "moviepy==1.0.3",
  "Pillow>=11,<13",
  "plotly>=6,<7",
]
notebooks = ["jupyter>=1.1,<2"]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.15,<0.16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: crosses multiple production components",
  "slow: takes materially longer than a unit test",
  "training: performs an RL learning update",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
